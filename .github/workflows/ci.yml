name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (swift test)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test

  macos:
    name: macOS (swift test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && xcodebuild -version && swift --version
      - run: swift test
