name: Sync local clone

# After every merge into main, the developer's Windows computer pulls it into its own clone of this repository,
# so the copy on that computer is the one on GitHub. It runs only on that computer's self-hosted runner (label
# angel-pc), so it spends no Actions minutes. A computer that is off runs the job when it comes back (GitHub cancels
# a job after a day of waiting; the next merge catches up). workflow_dispatch runs it by hand.
#
# Where the clone is: LOCAL_CLONE in the runner's own .env file (C:\actions-runner\macosanomationswitch\.env), not in this
# repository. Without it the job only says so. The job never overwrites work: a clone with uncommitted changes, on
# another branch or with local commits that are not on GitHub is fetched only.
#
# This workflow must never run on pull_request: the runner is the developer's own computer.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# The job fetches with its own read-only token, passed on the command line only: never written into the clone, and
# not the computer's Git login.
permissions:
  contents: read

defaults:
  run:
    shell: bash -e {0}

jobs:
  pull:
    # Not in a fork: a fork has no such runner and the job would wait a day.
    if: github.repository == 'cdealmeida3/macosanomationswitch'
    name: pull (angel-pc)
    runs-on: [ self-hosted, angel-pc ]
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-angel-pc
    steps:
      - name: Pull main into the local clone
        env:
          TOKEN: ${{ github.token }}
          TARGET: "main"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if [ -z "${LOCAL_CLONE:-}" ]; then
            echo "::notice::LOCAL_CLONE is not set in this runner's .env: no local clone to pull."
            exit 0
          fi
          cd "$LOCAL_CLONE"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c credential.helper= -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --quiet origin "$TARGET"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$branch" != "$TARGET" ]; then
            echo "::notice::$LOCAL_CLONE is on $branch: fetched only, not pulled."
          elif [ -n "$(git status --porcelain)" ]; then
            echo "::notice::$LOCAL_CLONE has uncommitted changes: fetched only, not pulled."
          elif ! git merge --ff-only --quiet "origin/$TARGET"; then
            echo "::warning::$LOCAL_CLONE has commits on $TARGET that are not on GitHub: fetched only, not pulled."
          else
            echo "$LOCAL_CLONE is at $(git log -1 --format='%h %s')"
          fi
